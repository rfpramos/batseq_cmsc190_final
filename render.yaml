# Render deployment manifest (template)
# Replace placeholders with your values or set environment variables in the Render dashboard.
# Docs: https://render.com/docs/deploying-docker

services:
  - type: web
    name: batseq-backend
    env: docker
    # Path to the Dockerfile in the repo
    dockerfilePath: backend/Dockerfile
    # Region: e.g., oregon, frankfurt, singapore, etc. Change to your preferred region.
    region: oregon
    # Plan: free, starter, standard-1x, etc.
    plan: free
    # Health check path
    healthCheckPath: /api/health
    # Auto-deploy when new commits are pushed to the connected branch
    autoDeploy: true
    # Start command (not needed for Docker but kept for clarity)
    startCommand: node server.js
    # Environment variables (do NOT put secrets in the repo; set them in Render dashboard or replace with Render secret references)
    envVars:
      - key: DB_HOST
        value: ""
      - key: DB_USER
        value: ""
      - key: DB_PASSWORD
        value: ""
      - key: DB_NAME
        value: ""
      - key: DB_CONNECTION_LIMIT
        value: "10"
      - key: DB_CONNECT_TIMEOUT_MS
        value: "5000"
      - key: DB_ACQUIRE_TIMEOUT_MS
        value: "5000"

# Notes:
# - This file is a template. On Render you can connect your GitHub repo and Render will use this file to create services.
# - For secrets, prefer adding them in the Render dashboard under the service's Environment settings.
# - If you want to use a managed database on Render, create the database in the Render UI and provide the connection details here.
