services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      PORT: 8080
      HOST: 0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
          REACT_APP_API_BASE_URL: http://157.230.224.245:8080
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
